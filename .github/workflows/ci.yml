name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: true
          cache: true

      - name: Cache Go build and module caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # go.mod is hashed as well as go.sum because this repo starts
          # with no go.sum: on go.sum alone hashFiles returns the empty
          # string, making `key` byte-identical to `restore-keys`, so
          # actions/cache would save once and then hit exactly forever.
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
          restore-keys: ${{ runner.os }}-go-

      # The frozen task, not `install`: a go.mod change that go.sum does
      # not reflect must fail here rather than have the runner quietly
      # write the missing hashes and carry on.
      - name: Install
        run: mise run install-frozen

      - name: Lint
        run: mise run lint

      - name: Build
        run: mise run build

      # `mise run test` enforces and prints the coverage floor itself.
      - name: Test
        run: mise run test

  vulncheck:
    name: Govulncheck (Go dependency audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: true
          cache: true

      # Queries https://vuln.go.dev, so it is its own job rather than
      # part of the offline `mise run ci` gate.
      - name: Audit Go dependencies (govulncheck)
        run: mise run vulncheck

  zizmor:
    name: Zizmor (GitHub Actions audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          # The action defaults to version "latest". Pin it so a zizmor
          # release cannot turn CI red on its own, and keep it equal to
          # the `zizmor` entry in .mise.toml — bump them together.
          #
          # `collect` is left at its default deliberately. The default
          # already collects .github/dependabot.yml (verified: zizmor
          # 1.29.0 with no --collect flag reports "completed
          # ./.github/dependabot.yml"). `all` differs only in that it
          # ignores .gitignore, which would drag vendored or downloaded
          # workflows into the audit.
          version: "1.29.0"
