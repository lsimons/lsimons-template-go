# mise: https://mise.jdx.dev/
#
# `mise install` installs everything under [tools]; `mise run <task>`
# wraps the native `go` / `golangci-lint` / `gofumpt` commands.
#
# Two version knobs live in go.mod and neither of them is an exact pin:
# the `go` directive is the language-version floor, and `toolchain` is a
# *minimum* toolchain ("if the invoking go is older, fetch this one") —
# a newer local go is used as-is and never downgraded. The only exact
# pin is the `go` entry under [tools] below, which is what mise actually
# installs. Keep it equal to go.mod's `toolchain`.

[settings]
minimum_release_age = "7d"
lockfile = true

# Every tool is pinned to an exact version, deliberately and without
# exception — including go. This is a supply-chain rule, not a
# stability one: an upstream compromise must never be auto-downloaded.
# A blanket "pin everything, update mechanically" policy is far easier
# to review than a per-dependency judgement about which upstreams are
# trustworthy enough to float.
#
# The cost is that nothing here is covered by dependabot, so these go
# stale silently. Refresh them deliberately with `mise up`, and read the
# diff.
[tools]
# The exact toolchain. Keep equal to go.mod's `toolchain` directive,
# which is only a minimum.
go = "1.26.5"
golangci-lint = "2.12.2"
gofumpt = "0.11.0"
# Used by `mise run vulncheck`. Not in mise's registry, so it comes from
# the Go module proxy via the `go:` backend, exact-pinned like the rest.
# It is compiled at install time, which is the one entry here that costs
# more than a download.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"
# Used by `mise run audit`; must match `version:` in the workflow's
# zizmor job. Bump them together.
zizmor = "1.29.0"
# Used by `mise run lint`. actionlint shells out to shellcheck for the
# `run:` blocks in workflows, and silently skips that half if shellcheck
# is missing, so it is pinned here too rather than left to the host.
actionlint = "1.7.12"
shellcheck = "0.11.0"

[env]
_.file = { path = ".env", optional = true }

# The description deliberately avoids the bare word "temp" + "late":
# init.py rewrites that word inside .toml files, so a description
# containing it renames itself on first run. See setup.md.
[tasks.init]
description = "Apply your project name throughout this repo (see scripts/init.py)"
run = "python3 scripts/init.py"

[tasks.install]
description = "go mod download"
run = "go mod download"

# No separate gofmt check: `.golangci.yml` enables the `gofumpt`
# formatter, `golangci-lint run` reports formatter diffs as issues, and
# gofumpt is a strict superset of gofmt — so `gofmt -l .` can never fail
# on a tree golangci-lint passes.
[tasks.lint]
description = "golangci-lint (incl. gofumpt) + go vet + go mod tidy check + actionlint"
run = [
  "golangci-lint run ./...",
  "go vet ./...",
  "go mod tidy -diff",
  "actionlint",
]

[tasks.format]
description = "gofumpt -w ."
run = "gofumpt -w ."

# Go has no built-in coverage floor, so it is enforced here rather than
# only reported. 50% is *exactly* what the placeholder measures —
# `run()` is fully covered and `main()` is not testable without a
# subprocess — so the margin is deliberately zero: the first real code
# you add must come with tests, or this goes red. Raise COVERAGE_MIN as
# the project grows.
[tasks.test]
description = "go test -race -covermode=atomic, with a coverage floor"
run = """
set -e
COVERAGE_MIN=50
go test -race -covermode=atomic -coverprofile=coverage.out ./...
total=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $NF); print $NF }')
echo "total coverage: ${total}% (floor ${COVERAGE_MIN}%)"
if ! awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit (t + 0 >= m + 0) ? 0 : 1 }'; then
  echo "coverage ${total}% is below the ${COVERAGE_MIN}% floor" >&2
  exit 1
fi
"""

[tasks.build]
description = "go build ./..."
run = "go build ./..."

[tasks.ci]
description = "Full CI gate"
depends = ["lint", "test", "build"]

# Checks the module graph against the Go vulnerability database. Needs
# network access, so it is not part of `ci`; CI runs it as its own job.
[tasks.vulncheck]
description = "govulncheck against the Go vulnerability database"
run = "govulncheck ./..."

# Near-mirror of the CI security jobs: govulncheck over the Go
# dependencies, and the mise-pinned zizmor over the workflows and the
# dependabot config. zizmor's default collection already picks up
# `.github/dependabot.yml` (`--collect=all` differs only in that it
# ignores .gitignore, which is the riskier direction — it walks
# gitignored trees such as vendored or downloaded workflows).
#
# It is a *near* mirror: `--strict-collection` has no `zizmor-action`
# input, so the local task fails on a schema error where CI only warns.
# Erring stricter locally is the right way round.
#
# Without a token zizmor silently falls back to offline and skips the
# `impostor-commit` and `known-vulnerable-actions` audits, which is an
# unverified result, not a pass — so refuse to run rather than exit 0 on
# a weaker check than the name promises. An already-exported GH_TOKEN
# wins, so a CI or secret-manager environment with no logged-in `gh`
# still works.
[tasks.audit]
description = "govulncheck + zizmor audit of workflows and dependabot config"
depends = ["vulncheck"]
run = """
set -e
GH_TOKEN="${GH_TOKEN:-$(gh auth token 2>/dev/null || true)}"
if [ -z "$GH_TOKEN" ]; then
  echo "No GitHub token: run \\`gh auth login\\` or export GH_TOKEN." >&2
  echo "Refusing to run a partial audit — the online audits would be" >&2
  echo "silently skipped." >&2
  exit 1
fi
export GH_TOKEN
zizmor --strict-collection .
"""

[tasks.ci-watch]
description = "Watch GitHub Actions CI for the current branch; exits non-zero on failure"
run = """
sleep 5
remote_url=$(git remote get-url upstream 2>/dev/null || git remote get-url origin)
repo=$(echo "$remote_url" | sed -E 's|^.*github\\.com[:/]||; s|\\.git$||')
run_id=$(gh run list --repo "$repo" --branch "$(git branch --show-current)" --limit 1 --json databaseId --jq '.[0].databaseId')
if [ -z "$run_id" ]; then echo "No run found for current branch on $repo" >&2; exit 1; fi
gh run watch --repo "$repo" --exit-status "$run_id"
"""
